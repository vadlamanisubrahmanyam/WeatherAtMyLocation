name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node & Java ────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 4. Expo prebuild ──────────────────────────────────────────
      - name: Expo prebuild (clean)
        run: npx expo prebuild --clean --platform android

      # ── 5. Generate OR restore keystore ───────────────────────────
      - name: Generate or restore keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔑 Restoring keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          else
            echo "⚠️  Generating new keystore (first run)..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias weatheratmylocation \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Subrahmanyam, OU=WeatherAtMyLocation, O=Mobile Apps, L=Hyderabad, ST=Telangana, C=IN" \
              -storepass weatherKey2024 \
              -keypass weatherKey2024
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "  KEYSTORE_BASE64 — copy this into GitHub Secrets   "
            echo "════════════════════════════════════════════════════"
            base64 -w 0 android/app/release.keystore
            echo ""
            echo "════════════════════════════════════════════════════"
          fi

      # ── 6. Inject signing config using Python (safe, no sed) ──────
      #
      # SDK 53 prebuild already writes a signingConfigs { debug { } }
      # block. We use Python to:
      #   a) add gradle.properties signing entries
      #   b) replace signingConfigs.debug with signingConfigs.release
      #      inside the release buildType (the only safe way to do this)
      #   c) append a release signingConfigs entry to the existing block
      #
      - name: Inject release signing config
        run: |
          ALIAS="${{ secrets.KEY_ALIAS }}"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          [ -z "$ALIAS" ]      && ALIAS="weatheratmylocation"
          [ -z "$STORE_PASS" ] && STORE_PASS="weatherKey2024"
          [ -z "$KEY_PASS" ]   && KEY_PASS="weatherKey2024"

          python3 << PYEOF
          import re

          # ── gradle.properties ─────────────────────────────────────
          with open("android/gradle.properties", "a") as f:
              f.write("""
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=${ALIAS}
          MYAPP_RELEASE_STORE_PASSWORD=${STORE_PASS}
          MYAPP_RELEASE_KEY_PASSWORD=${KEY_PASS}
          """)
          print("✓ gradle.properties updated")

          # ── app/build.gradle ──────────────────────────────────────
          with open("android/app/build.gradle", "r") as f:
              content = f.read()

          # 1. Add release block inside the existing signingConfigs { }
          #    We find the closing brace of the debug { } block and
          #    insert after it, still inside signingConfigs { }.
          release_block = """
              release {
                  storeFile file(MYAPP_RELEASE_STORE_FILE)
                  storePassword MYAPP_RELEASE_STORE_PASSWORD
                  keyAlias MYAPP_RELEASE_KEY_ALIAS
                  keyPassword MYAPP_RELEASE_KEY_PASSWORD
              }"""

          # Insert release signing config after the debug block (inside signingConfigs)
          content = re.sub(
              r'(signingConfigs\s*\{.*?debug\s*\{.*?\})',
              r'\1' + release_block,
              content,
              count=1,
              flags=re.DOTALL
          )

          # 2. Point the release buildType at signingConfigs.release
          #    (prebuild sets it to signingConfigs.debug by default)
          content = re.sub(
              r'(buildTypes\s*\{.*?release\s*\{.*?)signingConfig\s+signingConfigs\.debug',
              r'\1signingConfig signingConfigs.release',
              content,
              count=1,
              flags=re.DOTALL
          )

          with open("android/app/build.gradle", "w") as f:
              f.write(content)
          print("✓ app/build.gradle patched")

          # ── verify ────────────────────────────────────────────────
          with open("android/app/build.gradle", "r") as f:
              verify = f.read()
          assert "signingConfigs.release" in verify, "signingConfig not set to release!"
          assert "MYAPP_RELEASE_STORE_FILE" in verify, "store file not found!"
          print("✓ Verification passed")
          PYEOF

      # ── 7. Show final build.gradle for debugging ──────────────────
      - name: Show patched build.gradle
        run: |
          echo "--- android/app/build.gradle ---"
          cat android/app/build.gradle

      # ── 8. Build release APK ──────────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      # ── 9. Upload APK ─────────────────────────────────────────────
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherAtMyLocation-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
