name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node & Java ────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Install dependencies ───────────────────────────────────
      # --legacy-peer-deps avoids peer dep conflicts across RN 0.79 ecosystem
      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      # ── 4. Expo prebuild ──────────────────────────────────────────
      - name: Expo prebuild (clean)
        run: npx expo prebuild --clean --platform android
        env:
          NODE_ENV: production

      # ── 5. Generate OR restore keystore ───────────────────────────
      - name: Generate or restore keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔑 Restoring keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          else
            echo "⚠️  Generating new keystore (first run)..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias weatheratmylocation \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Subrahmanyam, OU=WeatherAtMyLocation, O=Mobile Apps, L=Hyderabad, ST=Telangana, C=IN" \
              -storepass weatherKey2024 \
              -keypass weatherKey2024
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "  KEYSTORE_BASE64 — copy this into GitHub Secrets   "
            echo "════════════════════════════════════════════════════"
            base64 -w 0 android/app/release.keystore
            echo ""
            echo "════════════════════════════════════════════════════"
          fi

      # ── 6. Patch app/build.gradle ─────────────────────────────────
      #
      # RN 0.79 prebuild generates a build.gradle that still has
      # enableBundleCompression in the react{} block — this property
      # was removed from ReactExtension. Strip it before Gradle runs.
      # Also inject the release signingConfig correctly.
      #
      - name: Patch build.gradle
        run: |
          ALIAS="${{ secrets.KEY_ALIAS }}"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          [ -z "$ALIAS" ]      && ALIAS="weatheratmylocation"
          [ -z "$STORE_PASS" ] && STORE_PASS="weatherKey2024"
          [ -z "$KEY_PASS" ]   && KEY_PASS="weatherKey2024"

          python3 - "$ALIAS" "$STORE_PASS" "$KEY_PASS" << 'PYEOF'
          import sys
          alias, store_pass, key_pass = sys.argv[1], sys.argv[2], sys.argv[3]

          with open("android/app/build.gradle", "r") as f:
              lines = f.readlines()

          out = []
          i = 0
          in_release_buildtype = False
          release_brace_depth  = 0

          while i < len(lines):
              line = lines[i]

              # a) Strip enableBundleCompression (removed from ReactExtension in RN 0.76+)
              if 'enableBundleCompression' in line:
                  print(f"  stripped: {line.rstrip()}")
                  i += 1
                  continue

              # b) Inject release signingConfig after the debug{} block closes
              #    inside signingConfigs{} — using brace-depth tracking,
              #    never regex on multi-line blocks.
              if 'signingConfigs {' in line and 'buildTypes' not in line:
                  out.append(line)
                  i += 1
                  depth = 1
                  debug_closed = False
                  while i < len(lines) and depth > 0:
                      l = lines[i]
                      opens  = l.count('{')
                      closes = l.count('}')
                      depth += opens - closes
                      out.append(l)
                      # depth==1 means we're back at signingConfigs level
                      # (debug block just closed)
                      if not debug_closed and depth == 1 and closes > 0:
                          debug_closed = True
                          out.append(
                              f'        release {{\n'
                              f'            storeFile file("release.keystore")\n'
                              f'            storePassword "{store_pass}"\n'
                              f'            keyAlias "{alias}"\n'
                              f'            keyPassword "{key_pass}"\n'
                              f'        }}\n'
                          )
                          print("  injected: release signingConfig block after debug{}")
                      i += 1
                  continue

              # c) Track when we enter the release buildType block
              #    Guard: 'signingConfigs' not in line avoids false match
              #    on "release {" inside signingConfigs we already processed
              if 'release {' in line and 'signingConfigs' not in line and not in_release_buildtype:
                  in_release_buildtype = True
                  release_brace_depth  = 1

              # d) While inside release buildType, track depth to know when we exit
              if in_release_buildtype:
                  opens  = line.count('{')
                  closes = line.count('}')
                  # Only count braces after the opening line itself
                  if release_brace_depth > 1 or 'release {' not in line:
                      release_brace_depth += opens - closes
                  if release_brace_depth <= 0:
                      in_release_buildtype = False

              # e) Switch signingConfig ONLY inside release buildType
              if 'signingConfig signingConfigs.debug' in line and in_release_buildtype:
                  line = line.replace('signingConfigs.debug', 'signingConfigs.release')
                  print("  switched: release buildType → signingConfigs.release")

              out.append(line)
              i += 1

          with open("android/app/build.gradle", "w") as f:
              f.writelines(out)

          result = "".join(out)
          assert 'enableBundleCompression'             not in result, "FAIL: enableBundleCompression still present"
          assert 'signingConfigs.release'               in result,    "FAIL: signingConfigs.release not found"
          assert 'storeFile file("release.keystore")'  in result,    "FAIL: storeFile not found"
          assert 'signingConfig signingConfigs.debug'   in result,    "FAIL: debug buildType was also changed"
          print("✓ All 4 assertions passed")
          PYEOF

      # ── 7. Show final build.gradle ────────────────────────────────
      - name: Show patched build.gradle
        run: cat android/app/build.gradle

      # ── 8. Build release APK ─────────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          NODE_ENV: production
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      # ── 9. Upload APK ─────────────────────────────────────────────
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherAtMyLocation-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
