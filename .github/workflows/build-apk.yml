name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node & Java ────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 4. Expo prebuild ──────────────────────────────────────────
      - name: Expo prebuild (clean)
        run: npx expo prebuild --clean --platform android

      # ── 5. Generate OR restore keystore ───────────────────────────
      - name: Generate or restore keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔑 Restoring keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          else
            echo "⚠️  Generating new keystore (first run)..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias weatheratmylocation \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Subrahmanyam, OU=WeatherAtMyLocation, O=Mobile Apps, L=Hyderabad, ST=Telangana, C=IN" \
              -storepass weatherKey2024 \
              -keypass weatherKey2024
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "  KEYSTORE_BASE64 — copy this into GitHub Secrets   "
            echo "════════════════════════════════════════════════════"
            base64 -w 0 android/app/release.keystore
            echo ""
            echo "════════════════════════════════════════════════════"
          fi

      # ── 6. Patch build.gradle (Python — safe, no sed) ─────────────
      #
      # Three things to fix in the prebuild-generated app/build.gradle:
      #
      # a) enableBundleCompression — removed in RN 0.76, but Expo 53's
      #    prebuild template still emits it → strip the line entirely.
      #
      # b) Add release signing config inside the existing
      #    signingConfigs { debug { } } block (not a new block).
      #
      # c) Switch the release buildType from signingConfigs.debug
      #    to signingConfigs.release.
      #
      - name: Patch build.gradle
        run: |
          ALIAS="${{ secrets.KEY_ALIAS }}"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          [ -z "$ALIAS" ]      && ALIAS="weatheratmylocation"
          [ -z "$STORE_PASS" ] && STORE_PASS="weatherKey2024"
          [ -z "$KEY_PASS" ]   && KEY_PASS="weatherKey2024"

          python3 - "$ALIAS" "$STORE_PASS" "$KEY_PASS" << 'PYEOF'
          import re, sys
          alias, store_pass, key_pass = sys.argv[1], sys.argv[2], sys.argv[3]

          with open("android/app/build.gradle", "r") as f:
              content = f.read()

          # a) Remove enableBundleCompression line (not in RN 0.76)
          content = re.sub(r'[ \t]*enableBundleCompression\s*=.*\n', '', content)
          print("✓ Removed enableBundleCompression")

          # b) Insert release signingConfig inside existing signingConfigs block
          release_signing = f"""
              release {{
                  storeFile file("release.keystore")
                  storePassword "{store_pass}"
                  keyAlias "{alias}"
                  keyPassword "{key_pass}"
              }}"""
          # Find signingConfigs { ... } and append release block before closing brace
          content = re.sub(
              r'(signingConfigs\s*\{)(.*?)(^\s*\})',
              lambda m: m.group(1) + m.group(2) + release_signing + '\n' + m.group(3),
              content, count=1, flags=re.DOTALL | re.MULTILINE
          )
          print("✓ Added release signingConfig")

          # c) Point release buildType to signingConfigs.release
          content = re.sub(
              r'(buildTypes\s*\{.*?release\s*\{.*?)signingConfig\s+signingConfigs\.debug',
              r'\1signingConfig signingConfigs.release',
              content, count=1, flags=re.DOTALL
          )
          print("✓ Switched release buildType to signingConfigs.release")

          with open("android/app/build.gradle", "w") as f:
              f.write(content)

          # Verify
          assert "enableBundleCompression" not in content, "enableBundleCompression still present!"
          assert "signingConfigs.release" in content,      "signingConfigs.release not found!"
          assert 'storeFile file("release.keystore")' in content, "storeFile not found!"
          print("✓ All assertions passed")
          PYEOF

      # ── 7. Show patched build.gradle ─────────────────────────────
      - name: Show patched build.gradle
        run: cat android/app/build.gradle

      # ── 8. Build release APK ─────────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      # ── 9. Upload APK ─────────────────────────────────────────────
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherAtMyLocation-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
