name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node & Java ───────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 4. Expo prebuild ─────────────────────────────────────────
      - name: Expo prebuild (clean)
        run: npx expo prebuild --clean --platform android

      # ── 5. Generate OR restore keystore ──────────────────────────
      - name: Generate or restore keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔑 Restoring keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          else
            echo "⚠️  Generating new keystore (first run)..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias weatheratmylocation \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Subrahmanyam, OU=WeatherAtMyLocation, O=Mobile Apps, L=Hyderabad, ST=Telangana, C=IN" \
              -storepass weatherKey2024 \
              -keypass weatherKey2024
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "  KEYSTORE_BASE64 — copy this into GitHub Secrets   "
            echo "════════════════════════════════════════════════════"
            base64 -w 0 android/app/release.keystore
            echo ""
            echo "════════════════════════════════════════════════════"
          fi

      # ── 6. Write gradle.properties signing config ─────────────────
      - name: Write signing properties
        run: |
          ALIAS="${{ secrets.KEY_ALIAS }}"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          [ -z "$ALIAS" ]      && ALIAS="weatheratmylocation"
          [ -z "$STORE_PASS" ] && STORE_PASS="weatherKey2024"
          [ -z "$KEY_PASS" ]   && KEY_PASS="weatherKey2024"

          cat >> android/gradle.properties << EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=${ALIAS}
          MYAPP_RELEASE_STORE_PASSWORD=${STORE_PASS}
          MYAPP_RELEASE_KEY_PASSWORD=${KEY_PASS}
          EOF

      # ── 7. Patch app/build.gradle with signingConfig ─────────────
      # SDK 53 / RN 0.76 uses AGP 8.x — signingConfigs must go
      # inside the android {} block, before buildTypes.
      - name: Patch build.gradle with signingConfig
        run: |
          GRADLE_FILE="android/app/build.gradle"

          # Insert signingConfigs block before buildTypes
          sed -i '/buildTypes {/i\
              signingConfigs {\
                  release {\
                      storeFile file(MYAPP_RELEASE_STORE_FILE)\
                      storePassword MYAPP_RELEASE_STORE_PASSWORD\
                      keyAlias MYAPP_RELEASE_KEY_ALIAS\
                      keyPassword MYAPP_RELEASE_KEY_PASSWORD\
                  }\
              }' "$GRADLE_FILE"

          # Add signingConfig reference inside release buildType
          sed -i '/buildTypes {/,/}/ s/release {/release {\n                signingConfig signingConfigs.release/' "$GRADLE_FILE"

          echo "--- Patched build.gradle excerpt ---"
          grep -A 20 "signingConfigs" "$GRADLE_FILE" | head -30

      # ── 8. Pin compileSdkVersion & Kotlin ────────────────────────
      # SDK 53 targets compileSdk 35; Kotlin 1.9.24 is stable with it
      - name: Pin SDK and Kotlin versions
        run: |
          # Pin compileSdk to 35 for SDK 53
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' android/build.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' android/build.gradle   || true
          sed -i 's/kotlinVersion = .*/kotlinVersion = "1.9.24"/' android/build.gradle   || true
          echo "--- build.gradle versions ---"
          grep -E "compileSdk|targetSdk|kotlinVersion" android/build.gradle || true

      # ── 9. Build release APK ─────────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      # ── 10. Upload APK artifact ───────────────────────────────────
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherAtMyLocation-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
