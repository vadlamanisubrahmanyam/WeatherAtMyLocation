name: Build Signed APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node & Java ───────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 3. Install dependencies ───────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 4. Expo prebuild ─────────────────────────────────────────
      - name: Expo prebuild (clean)
        run: npx expo prebuild --clean --platform android

      # ── 5. Generate OR restore keystore ──────────────────────────
      #
      #  First push:  KEYSTORE_BASE64 secret is empty → keytool generates
      #               a fresh keystore in CI → base64 is printed in the
      #               job log so you can copy it into the secret once.
      #
      #  Every push after that:  KEYSTORE_BASE64 is set → decoded straight
      #                          to disk, keytool is never called again.
      #
      - name: Generate or restore keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔑 Restoring keystore from secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          else
            echo "⚠️  KEYSTORE_BASE64 secret not set — generating a new keystore now."
            echo "    After this run, copy the base64 block below into the repo secret."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias weatheratmylocation \
              -keyalg RSA -keysize 2048 \
              -validity 10000 \
              -dname "CN=Subrahmanyam, OU=WeatherAtMyLocation, O=Mobile Apps, L=Hyderabad, ST=Telangana, C=IN" \
              -storepass weatherKey2024 \
              -keypass weatherKey2024
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "  KEYSTORE_BASE64 — paste this into GitHub Secrets  "
            echo "════════════════════════════════════════════════════"
            base64 -w 0 android/app/release.keystore
            echo ""
            echo "════════════════════════════════════════════════════"
          fi

      # ── 6. Inject signing config into gradle.properties ──────────
      - name: Write signing properties
        run: |
          ALIAS="${{ secrets.KEY_ALIAS }}"
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"

          # Fall back to generated values if secrets not yet set
          [ -z "$ALIAS" ]      && ALIAS="weatheratmylocation"
          [ -z "$STORE_PASS" ] && STORE_PASS="weatherKey2024"
          [ -z "$KEY_PASS" ]   && KEY_PASS="weatherKey2024"

          cat >> android/gradle.properties << EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=${ALIAS}
          MYAPP_RELEASE_STORE_PASSWORD=${STORE_PASS}
          MYAPP_RELEASE_KEY_PASSWORD=${KEY_PASS}
          EOF

      # ── 7. Patch app/build.gradle with signingConfig ─────────────
      - name: Patch build.gradle with signingConfig
        run: |
          GRADLE_FILE="android/app/build.gradle"

          sed -i '/buildTypes {/i\
              signingConfigs {\
                  release {\
                      storeFile file(MYAPP_RELEASE_STORE_FILE)\
                      storePassword MYAPP_RELEASE_STORE_PASSWORD\
                      keyAlias MYAPP_RELEASE_KEY_ALIAS\
                      keyPassword MYAPP_RELEASE_KEY_PASSWORD\
                  }\
              }' "$GRADLE_FILE"

          sed -i '/buildTypes {/{n;/release {/{n;s/$/\n                    signingConfig signingConfigs.release/}}' "$GRADLE_FILE"

      # ── 8. Pin SDK and Kotlin versions ───────────────────────────
      - name: Pin compileSdkVersion and Kotlin
        run: |
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/build.gradle || true
          sed -i 's/kotlinVersion = .*/kotlinVersion = "1.9.24"/' android/build.gradle || true

      # ── 9. Build release APK ─────────────────────────────────────
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m"

      # ── 10. Upload APK ───────────────────────────────────────────
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherAtMyLocation-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
